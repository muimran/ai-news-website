<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Second Order template boards</title>
<!--
  The source for every template image. Each board is drawn at its real size.
  ?b=<file name>  shows one board alone (this is how the images are made)
  ?guides=1       draws the safe zones and the 3:4 grid crop
  ?m=1            measures each board's empty space into #out
  ?list=1         lists every board and its height into #out
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..700&family=Anek+Latin:wght@400..700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@500..700&family=Geist:wght@400..800&family=IBM+Plex+Sans:ital,wght@1,400;1,500;1,600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #6d6d6a; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px; padding: 48px; }
  body.one { padding: 0; gap: 0; background: transparent; }
  .wrap { display: flex; flex-direction: column; gap: 10px; }
  .wrap > .id { color: #fff; font: 500 20px/1.2 'IBM Plex Mono', monospace; }
  body.one .wrap > .id { display: none; }
  #out { display: none; }

  /* ---- the brand, as the website has it ---- */
  .light { --ground: #e7e5e0; --card: #fbfaf6; --ink: #161615; }
  .dark { --ground: #0f0f0e; --card: #1b1b19; --ink: #ecebe5; }
  /* each topic has one quiet tone: deep for marks, a pale wash for grounds (the website's dossier wash) */
  /* the website's two accent families, orange and indigo; each topic pairs them as the site's illustrations do:
     --acc is the strong colour (fills, bars, dots), --tint the pale one (washes) */
  .t01, .t03 { --acc-l: #e07a3f; --acc-d: #e07a3f; --tint: #f6dccb; }   /* orange on orange */
  .t02, .t04 { --acc-l: #5f5e9c; --acc-d: #9c9bc9; --tint: #d7d7ec; }   /* indigo on indigo */
  .t05 { --acc-l: #5f5e9c; --acc-d: #9c9bc9; --tint: #f6dccb; }         /* indigo on orange */
  .t06 { --acc-l: #e07a3f; --acc-d: #e07a3f; --tint: #d7d7ec; }         /* orange on indigo */
  .t01, .t03, .t06 { --on-acc-l: #161615; } .t02, .t04, .t05 { --on-acc-l: #ffffff; }
  .light { --tone: var(--acc-l); --on-tone: var(--on-acc-l); --wash: var(--tint); }
  .dark { --tone: var(--acc-d); --on-tone: #161615; --wash: color-mix(in srgb, var(--tint) 13%, var(--ground)); }
  .board {
    --accent: #6a3fd1;
    --paper: #fbfaf6;
    --mute: color-mix(in srgb, var(--ink) 60%, var(--card));
    --hair: color-mix(in srgb, var(--ink) 14%, var(--card));
    --field: var(--card);
    --M: 72px;     /* margin: every word starts here */
    --B: 48px;     /* the strip above the card, notch posts only */
    --row: 84px;   /* the notch's row */
    --top: 192px;  /* where words start under the row, and where they end above the logo */
    --foot: 72px;  /* the logo's distance from the bottom */
    --line: 2px;
    position: relative; overflow: hidden; flex: none;
    width: 1080px; height: 1350px;
    background: var(--field); color: var(--ink);
    font-family: 'Anek Latin', 'Anek Bangla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .board.tint { --field: var(--wash); }
  /* a single post can take the tone itself as its field */
  .light.deep { --field: var(--acc-l); --ink: var(--on-acc-l); --card: var(--acc-l); }
  .dark.deep { --field: color-mix(in srgb, var(--acc-d) 24%, #0f0f0e); }
  .light.deep .ptab { --ink: #161615; --card: #fbfaf6; background: #fbfaf6; }
  .tn { background: var(--tone); color: var(--on-tone); padding: 0 0.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* the big number on a block of the tone, as the FT sets its numbers */
  .nblock { align-self: flex-start; display: flex; align-items: baseline; gap: 20px; padding: 52px 52px 40px; background: var(--tone); color: var(--on-tone); }
  .nblock .num { color: inherit; }
  .portrait { width: 300px; height: 360px; flex: none; background: var(--wash); display: grid; place-items: center; color: var(--mute); }
  .board.story { height: 1920px; --B: 250px; --foot: 250px; --top: 394px; }
  /* the link preview, 1200 × 630, for Facebook and LinkedIn */
  .board.link { width: 1200px; height: 630px; --M: 56px; --B: 32px; --row: 74px; --top: 150px; --foot: 56px; }
  .link .tab { font-size: 30px; gap: 18px; padding-right: 28px; }
  .link .tab b { width: 49px; height: 42px; }
  .link .mono { font-size: 24px; }
  .link .mono.s { font-size: 20px; }
  .link .xl { font-size: 76px; font-variation-settings: 'opsz' 31; }
  .link .l { font-size: 60px; line-height: 1.06; font-variation-settings: 'opsz' 25; }
  .link .logo { width: 200px; height: 50px; font-size: 18px; }
  .link .main { gap: 24px; }
  /* Bangla: Noto Serif Bengali at 82% of the English size, taller lines; labels in Anek Bangla, no capitals */
  .board[lang="bn"] { font-family: 'Anek Bangla', 'Anek Latin', sans-serif; }
  [lang="bn"] .hl { font-family: 'Noto Serif Bengali', serif; font-weight: 600; line-height: 1.34; letter-spacing: 0; }
  [lang="bn"] .xl { font-size: 118px; }
  [lang="bn"] .l { font-size: 79px; }
  [lang="bn"] .mono { font-family: 'Anek Bangla', sans-serif; font-size: 33px; letter-spacing: 0.01em; text-transform: none; }
  [lang="bn"] .mono.s { font-size: 28px; }
  [lang="bn"] .tab, [lang="bn"] .ptab { font-family: 'Anek Bangla', sans-serif; font-size: 36px; }
  [lang="bn"] .m { font-size: 54px; line-height: 1.34; }
  [lang="bn"] .q { font-size: 66px; line-height: 1.4; }
  [lang="bn"] .txt { font-size: 40px; line-height: 1.55; }
  [lang="bn"] .att, [lang="bn"] .bars .lab, [lang="bn"] .bars .val, [lang="bn"] .tl .pt .ev { font-family: 'Anek Bangla', sans-serif; }
  [lang="bn"] .num, [lang="bn"] .unit { font-family: 'Anek Bangla', sans-serif; }
  [lang="bn"] .unit { font-size: 52px; }
  [lang="bn"] .tl .pt .mono { width: 290px; }
  .link[lang="bn"] .xl { font-size: 64px; } .link[lang="bn"] .l { font-size: 50px; line-height: 1.32; }
  .link[lang="bn"] .mono { font-size: 28px; } .link[lang="bn"] .mono.s { font-size: 24px; }
  .link[lang="bn"] .tab { font-size: 32px; }
  /* print: one board per page, for the LinkedIn document post */
  @page { size: 1080px 1350px; margin: 0; }
  body.pdf { padding: 0; gap: 0; display: block; background: none; }
  body.pdf .wrap { display: block; break-after: page; }
  body.pdf .wrap > .id { display: none; }

  /* ---- the notch: the corner cut away, the wash showing through ---- */
  /* the notch: a solid tab cut into the top-left corner, from the top edge down; the date beside it.
     On a story it hangs just under the 250 px the app covers. No line across, no strip. */
  .tabrow { position: absolute; left: 0; top: 0; height: calc(var(--B) + var(--row)); display: flex; align-items: stretch; gap: 28px; z-index: 3; }
  .tabrow > .mono { display: flex; align-items: center; padding-top: var(--B); }
  .tab { display: flex; align-items: center; gap: 21px; padding: var(--B) 32px 0 var(--M); background: var(--wash); font-size: 34px; font-weight: 600; line-height: 1; white-space: nowrap; }
  .story .tabrow { top: var(--B); height: var(--row); }
  .story .tabrow > .mono, .story .tab { padding-top: 0; }
  .tint .tab { background: var(--ground); }
  .tab b, .ptab b { display: grid; place-items: center; width: 56px; height: 48px; padding-top: 2px; background: var(--ink); color: var(--card); font-weight: 600; letter-spacing: 0; }
  .tab .t, .ptab .t { padding-top: 3px; }
  .new .tab { background: var(--accent); color: #fff; }
  /* on a photo that fills the slide, the notch is a solid tab cut into the corner */
  .ptab { position: absolute; left: 0; top: 0; z-index: 3; height: calc(var(--B) + var(--row)); padding: var(--B) 32px 0 var(--M); display: flex; align-items: center; gap: 21px; background: var(--wash); color: var(--ink); font-size: 34px; font-weight: 600; line-height: 1; white-space: nowrap; }
  .story .ptab { top: var(--B); height: var(--row); padding-top: 0; }
  .new .ptab { background: var(--accent); color: #fff; }

  /* ---- type ---- */
  .mono { font-family: 'IBM Plex Mono', 'Anek Bangla', monospace; font-weight: 500; font-size: 28px; line-height: 1.3; letter-spacing: 0.07em; text-transform: uppercase; }
  .mono.s { font-size: 24px; }
  .hl { font-family: 'Fraunces', 'Noto Serif Bengali', Georgia, serif; font-weight: 560; line-height: 1.04; letter-spacing: -0.022em; font-optical-sizing: none; text-wrap: balance; }
  .xl { font-size: 144px; font-variation-settings: 'opsz' 52; }
  .l { font-size: 96px; font-variation-settings: 'opsz' 35; }
  .m { font-size: 64px; line-height: 1.06; font-variation-settings: 'opsz' 23; }
  .q { font-size: 80px; line-height: 1.1; font-variation-settings: 'opsz' 29; }
  .num { font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 220px; line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; }
  .unit { font-family: 'Anek Latin', sans-serif; font-weight: 600; font-size: 72px; line-height: 1; }
  .txt { font-size: 40px; line-height: 1.4; font-weight: 400; text-wrap: pretty; }
  .att { font-size: 34px; line-height: 1.3; font-weight: 600; }

  /* ---- where things sit ---- */
  .main { position: absolute; left: var(--M); right: var(--M); display: flex; flex-direction: column; gap: 36px; z-index: 3; }
  .main.top { top: var(--top); }
  .main.bot { bottom: var(--top); }
  .story .main.bot { bottom: 394px; }
  .meta { position: absolute; left: var(--M); right: var(--M); bottom: var(--top); }
  .logo { position: absolute; z-index: 3; left: var(--M); bottom: var(--foot); width: 240px; height: 60px; border: 2px dashed currentColor; display: grid; place-items: center; font: 500 22px/1 'IBM Plex Mono', monospace; letter-spacing: 0.07em; }
  /* the carousel's dots: one per slide, the one you're on filled in the topic's tone */
  .pager { position: absolute; z-index: 3; right: var(--M); bottom: var(--foot); height: 60px; display: flex; align-items: center; gap: 30px; }
  .dots { display: flex; gap: 16px; }
  .dots i { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid currentColor; }
  .dots i.on { background: var(--tone); border-color: var(--tone); }
  .new .dots i.on { background: var(--accent); border-color: var(--accent); }
  .w .dots i.on { background: var(--acc-d); border-color: var(--acc-d); }
  .pager svg { width: 64px; height: 24px; overflow: visible; }
  .w { color: var(--paper); }

  /* ---- pictures ---- */
  .col { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; }
  .col > .pad { padding: 0 var(--M); display: flex; flex-direction: column; gap: 36px; }
  .ph { position: relative; flex: 1 1 auto; min-height: 300px; overflow: hidden; background: var(--wash); }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph.fit img { object-fit: contain; padding: 56px 72px; }
  .cr { padding: 16px var(--M) 0; text-align: right; }
  .full { position: absolute; inset: 0; }
  .full img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet { position: absolute; left: 0; right: 0; z-index: 3; background: var(--card); padding: 0 var(--M); display: flex; flex-direction: column; }
  .sheet.bot { bottom: 0; padding-top: 56px; }
  .scrim { position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none; }
  .scrim.bot { bottom: 0; height: 78%; background: linear-gradient(to top, rgba(14,12,10,0.88) 0%, rgba(14,12,10,0.76) 45%, rgba(14,12,10,0) 100%); }
  .scrim.top { top: 0; height: 62%; background: linear-gradient(to bottom, rgba(14,12,10,0.84) 0%, rgba(14,12,10,0.66) 45%, rgba(14,12,10,0) 100%); }
  .scrim.foot { bottom: 0; height: 22%; background: linear-gradient(to top, rgba(14,12,10,0.6), rgba(14,12,10,0)); }
  .hole { position: relative; flex: 1 1 auto; min-height: 300px; background: var(--wash); display: grid; place-items: center; }
  .slot { position: absolute; left: var(--M); right: var(--M); border: 3px dashed var(--mute); display: grid; place-items: center; color: var(--mute); }
  .slot.w { border-color: rgba(251,250,246,0.7); color: rgba(251,250,246,0.85); }

  /* a screenshot: as captured, cropped clean, a thin ink line round it */
  .shot { position: absolute; left: var(--M); right: var(--M); border: 3px solid var(--ink); background: #fff; overflow: hidden; }
  .ui { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #1d1d1f; padding: 44px 46px; display: flex; flex-direction: column; gap: 34px; font-size: 30px; line-height: 1.45; }
  .ui-q { align-self: flex-end; max-width: 76%; background: #ececec; padding: 16px 26px; border-radius: 26px; }

  /* ---- charts: the topic's tone for the point, the muted grey for the rest ---- */
  .bars { display: flex; flex-direction: column; margin-top: 30px; }
  .bars .row { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
  .bars .lab { align-self: center; font-size: 36px; font-weight: 600; line-height: 1.15; padding-right: 20px; }
  .bars .val { display: flex; align-items: center; gap: 20px; padding: 20px 0; border-left: 2px solid var(--ink); font-size: 40px; font-weight: 600; }
  .bars .bar { height: 76px; background: var(--mute); }
  .bars .bar.key { background: var(--tone); }
  .tl { position: relative; height: 540px; margin: 66px 0 0; }
  .tl::before { content: ''; position: absolute; left: 8px; top: 0; height: 100%; width: 2px; background: var(--ink); }
  .tl .pt { position: absolute; left: 0; display: flex; align-items: center; gap: 30px; transform: translateY(-50%); }
  .tl .pt i { width: 18px; height: 18px; background: var(--tone); flex: none; }
  .tl .pt .mono { width: 196px; flex: none; }
  .tl .pt .ev { font-size: 40px; font-weight: 600; line-height: 1.2; }
  .numrow { display: flex; align-items: baseline; gap: 20px; }

  /* ---- the English type: Geist for headlines, text and numbers; quotes in IBM Plex Sans Italic ---- */
  .board:not([lang="bn"]) .hl { font-family: 'Geist', sans-serif; font-weight: 600; letter-spacing: -0.035em; line-height: 1.12; font-variation-settings: normal; }
  .board:not([lang="bn"]) .txt, .board:not([lang="bn"]) .att, .board:not([lang="bn"]) .tab, .board:not([lang="bn"]) .ptab, .board:not([lang="bn"]) .num, .board:not([lang="bn"]) .unit, .board:not([lang="bn"]) .bars .lab, .board:not([lang="bn"]) .bars .val, .board:not([lang="bn"]) .tl .pt .ev { font-family: 'Geist', sans-serif; }
  .board:not([lang="bn"]) .q { font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-weight: 500; letter-spacing: -0.015em; line-height: 1.18; }
  .board:not([lang="bn"]) .xl { font-size: 112px; }
  .board:not([lang="bn"]) .l { font-size: 72px; }
  .board:not([lang="bn"]) .m { font-size: 54px; line-height: 1.14; }
  .board:not([lang="bn"]) .q { font-size: 64px; }
  .board.link:not([lang="bn"]) .xl { font-size: 60px; }
  .board.link:not([lang="bn"]) .l { font-size: 48px; }

  /* the quote card: black, one orange quote mark */
  .board.quoteink { --field: #161615; --ink: #fbfaf6; --card: #161615; color: #fbfaf6; }
  .qmark { position: absolute; left: 72px; top: 110px; font: 600 260px/1 'Geist', sans-serif; color: #e07a3f; }

  /* ---- checks ---- */
  body.guides .board::after { content: ''; position: absolute; inset: 60px; border: 2px dashed #ff2d6f; pointer-events: none; z-index: 50; }
  body.guides .board::before { content: ''; position: absolute; top: 0; bottom: 0; left: 34px; right: 34px; border-left: 2px solid #00a2ff; border-right: 2px solid #00a2ff; pointer-events: none; z-index: 50; }
  body.guides .board.story::after { inset: 250px 60px; }
  body.guides .board.story::before { display: none; }
</style>
</head>
<body>
<pre id="out"></pre>
<script>
const IMG = 'img/';
const DATE = ''; /* no dates on the cards */
const SHORT = 'AI’s next limit is electricity';
const LONG = 'By 2030, the world’s data centres could use more electricity than Japan';
const CREDIT = 'Illustrative image · Unsplash';

const arrow = `<svg viewBox="0 0 64 24" aria-hidden="true"><path d="M0 12H61M51 2L61.5 12L51 22" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;
const logo = (cls = '') => `<div class="logo ${cls}">[LOGO]</div>`;
const pager = (on, cls = '', more = false) => `<div class="pager ${cls}"><span class="dots">${[1, 2, 3, 4, 5, 6].map((i) => `<i${i === on ? ' class="on"' : ''}></i>`).join('')}</span>${more ? arrow : ''}</div>`;
const foot = (on, cls = '', more = false) => `${logo(cls)}${pager(on, cls, more)}`;
const notch = (n, label, after = '') => `<div class="tabrow"><span class="tab"><b>${n}</b>${label ? `<span class="t">${label}</span>` : ''}</span>${after ? `<span class="mono">${after}</span>` : ''}</div>`;
const ptab = (n, label) => `<div class="ptab"><b>${n}</b>${label ? `<span class="t">${label}</span>` : ''}</div>`;
const img = (src, pos = '50% 50%') => `<img src="${IMG}${src}" alt="" style="object-position:${pos}">`;
const credit = (text = CREDIT) => `<div class="cr mono s">${text}</div>`;
const sticker = (cls = '') => `<div class="slot mono ${cls}" style="position:relative;left:0;right:0;width:600px;height:120px">[Link sticker]</div>`;
const shotUI = `<div class="ui">
  <div class="ui-q">How much electricity did this answer use?</div>
  <div>There isn’t one exact figure. Estimates for a single text answer range from a fraction of a watt-hour to a few watt-hours, depending on the model, the hardware and the data centre that runs it.</div>
</div>`;
const bars = (rows) => `<div class="bars">${rows.map(([lab, v, key, shown]) => `<div class="row"><span class="lab">${lab}</span><span class="val"><span class="bar${key ? ' key' : ''}" style="width:${Math.round(v / 45 * 500)}px"></span>${shown || v + '%'}</span></div>`).join('')}</div>`;
const timeline = (pts) => `<div class="tl">${pts.map(([at, when, what]) => `<div class="pt" style="top:${(at * 100).toFixed(2)}%"><i></i><span class="mono">${when}</span><span class="ev">${what}</span></div>`).join('')}</div>`;

const CAP = {
  office: 'The screens in an office use little power. The servers they talk to use a great deal more.',
  cctv: 'Data centres are guarded like banks: cameras on every wall and very few visitors.',
  dhaka: 'Dhaka’s grid already struggles in summer. New data centres would draw on it too.',
  desks: 'Every question typed at a desk like this is answered by a machine in a data centre, often in another country.',
  pylons: 'A data centre draws power every hour of the day, so where one can be built depends on the grid.',
};

/* [template, variant, extra classes, html] — feed posts are 1080 × 1350 */
const D = [
  ['01-cover', 'text-top-short', '', () => `${notch('06', 'Explainer', DATE)}
    <div class="col" style="top:192px;bottom:190px"><div class="pad"><h1 class="hl xl">${SHORT}</h1></div>
    <div class="ph" style="margin-top:60px">${img('col-pylons.jpg', '50% 72%')}</div>${credit()}</div>${foot(1, '', true)}`],
  ['01-cover', 'text-bottom-short', '', () => `${notch('06', 'Explainer', DATE)}
    <div class="col" style="top:132px;bottom:192px"><div class="ph">${img('col-pylons.jpg', '50% 72%')}</div>${credit()}
    <div class="pad" style="margin-top:44px"><h1 class="hl xl">${SHORT}</h1></div></div>${foot(1, '', true)}`],
  ['01-cover', 'fullbleed', '', () => `<div class="full">${img('col-pylons.jpg', '42% 50%')}</div><div class="scrim bot"></div>${ptab('06', 'Explainer')}
    <div class="main bot w" style="gap:28px"><span class="mono">${DATE}</span><h1 class="hl xl">${SHORT}</h1><span class="mono s" style="align-self:flex-end">${CREDIT}</span></div>${foot(1, 'w', true)}`],
  ['01-cover', 'text-bottom-long', 'tint', () => `${notch('06', 'Explainer', DATE)}
    <div class="main bot"><h1 class="hl l">${LONG}</h1></div>${foot(1, '', true)}`],
  ['01-cover', 'new', 'new', () => `${notch('06', 'New', 'Explainer · ' + DATE)}
    <div class="main top"><h1 class="hl l">${LONG}</h1></div>${foot(1, '', true)}`],

  ['02-text', '', '', () => `<div class="main top"><h2 class="hl l">Every answer runs on a server</h2>
    <p class="txt">Those servers sit in data centres, which used about <span class="tn">415 terawatt-hours</span> of electricity in 2024, about 1.5% of the world’s total. The International Energy Agency expects that to more than double by 2030.</p></div>${foot(2)}`],

  ['03-image', 'photo-text-top', '', () => `<div class="col" style="top:132px;bottom:190px"><div class="pad"><p class="txt">${CAP.office}</p></div>
    <div class="ph" style="margin-top:56px">${img('col-office.jpg', '50% 60%')}</div>${credit()}</div>${foot(3)}`],
  ['03-image', 'photo-text-bottom', '', () => `<div class="col" style="top:0;bottom:192px"><div class="ph">${img('col-cctv.jpg', '50% 40%')}</div>${credit()}
    <div class="pad" style="margin-top:40px"><p class="txt">${CAP.cctv}</p></div></div>${foot(3)}`],
  ['03-image', 'fit', '', () => `<div class="col" style="top:0;bottom:192px"><div class="ph fit">${img('col-dhaka.jpg')}</div>${credit()}

const CLEAN = (f, w = 650, ls = -0.03) => `.board:not([lang="bn"]) .hl { font-family: '${f}', sans-serif; font-weight: ${w}; letter-spacing: ${ls}em; line-height: 1.12; font-variation-settings: normal; } .board:not([lang="bn"]) .q { font-family: 'IBM Plex Sans', sans-serif; font-style: italic; font-weight: 500; letter-spacing: -0.015em; line-height: 1.18; } ` + SANS(f);
const TYPE = {
  intertight: [GF + 'Inter+Tight:wght@400..800' + PLEXQ, CLEAN('Inter Tight', 650, -0.03)],
  geist: [GF + 'Geist:wght@400..800' + PLEXQ, CLEAN('Geist', 600, -0.035)],
  plexsans: [GF + 'IBM+Plex+Sans:wght@400;500;600;700' + PLEXQ, CLEAN('IBM Plex Sans', 600, -0.02)],
  dmsans: [GF + 'DM+Sans:opsz,wght@9..40,400..800' + PLEXQ, CLEAN('DM Sans', 650, -0.035)],
  instrumentsans: [GF + 'Instrument+Sans:wght@400..700' + PLEXQ, CLEAN('Instrument Sans', 600, -0.025)],
  figtree: [GF + 'Figtree:wght@400..800' + PLEXQ, CLEAN('Figtree', 650, -0.03)],
  intertightitalic: [GF + 'Inter+Tight:ital,wght@0,400..800;1,400..800', CLEAN('Inter Tight', 650, -0.03) + ` .board:not([lang="bn"]) .q, .board:not([lang="bn"]) .tn { font-style: italic; } .board:not([lang="bn"]) .q { font-weight: 500; letter-spacing: -0.02em; }`],
  plexitalic: [GF + 'IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600', CLEAN('IBM Plex Sans', 600, -0.02) + ` .board:not([lang="bn"]) .hl { font-style: italic; }`],
  plexitalicq: [GF + 'IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600', CLEAN('IBM Plex Sans', 600, -0.02)],
  serifitalic: [GF + 'Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1', CLEAN('Instrument Sans', 600, -0.025) + ` .board:not([lang="bn"]) .q { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 100px; line-height: 1.02; letter-spacing: -0.01em; } .board:not([lang="bn"]) .hl .tn { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 1.15em; letter-spacing: 0; }`],

  newsreader: [GF + 'Newsreader:ital,opsz,wght@0,6..72,400..800', `.board:not([lang="bn"]) .hl { font-family: 'Newsreader', serif; font-weight: 600; letter-spacing: -0.012em; line-height: 1.04; font-variation-settings: normal; font-optical-sizing: auto; }`],
  instrument: [GF + 'Instrument+Serif', `.board:not([lang="bn"]) .hl { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.98; font-variation-settings: normal; } .board:not([lang="bn"]) .xl { font-size: 172px; } .board:not([lang="bn"]) .l { font-size: 114px; } .board:not([lang="bn"]) .q { font-size: 96px; line-height: 1.02; }`],
  sourceserif: [GF + 'Source+Serif+4:opsz,wght@8..60,400..800', `.board:not([lang="bn"]) .hl { font-family: 'Source Serif 4', serif; font-weight: 650; letter-spacing: -0.018em; line-height: 1.04; font-variation-settings: normal; font-optical-sizing: auto; }`],
  schibsted: [GF + 'Schibsted+Grotesk:wght@400..900', `.board:not([lang="bn"]) .hl { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 1.0; font-variation-settings: normal; } ` + SANS('Schibsted Grotesk')],
  bricolage: [GF + 'Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800', `.board:not([lang="bn"]) .hl { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.035em; line-height: 0.98; font-variation-settings: 'wdth' 92; font-optical-sizing: auto; } ` + SANS('Bricolage Grotesque')],
};
if (TYPE[q.get('type')]) {
  const [href, css] = TYPE[q.get('type')];
  document.head.insertAdjacentHTML('beforeend', `<link rel="stylesheet" href="${href}"><style>${css}</style>`);
}
const only = q.get('b');
if (q.get('guides')) document.body.classList.add('guides');
if (only) document.body.classList.add('one');
if (q.get('list')) document.getElementById('out').textContent = boards.map((b) => b.cls.includes('link') ? `${b.id} 1200 630` : `${b.id} 1080 ${b.cls.includes('story') ? 1920 : 1350}`).join('\n');
const pdf = q.get('pdf') ? q.get('pdf').split(',') : null;
if (pdf) document.body.classList.add('pdf');
for (const b of pdf ? pdf.map((id) => boards.find((x) => x.id === id)) : boards) {
  if (only && b.id !== only) continue;
  if (q.get('list')) break;
  const w = document.createElement('div');
  w.className = 'wrap';
  w.innerHTML = `<div class="id">${b.id}</div><div class="board ${b.cls}" id="${b.id}"${b.bn ? ' lang="bn"' : ''}>${clean(b.html())}</div>`;
  document.body.append(w);
}

/* how much of a board is left empty: words by their lines, pictures and marks by their boxes */
function empty(board) {
  const r0 = board.getBoundingClientRect(), S = 6;
  const cols = Math.ceil(r0.width / S), rows = Math.ceil(r0.height / S);
  const g = new Uint8Array(cols * rows);
  const mark = (r) => {
    const x0 = Math.max(0, Math.floor((r.left - r0.left) / S)), x1 = Math.min(cols, Math.ceil((r.right - r0.left) / S));
    const y0 = Math.max(0, Math.floor((r.top - r0.top) / S)), y1 = Math.min(rows, Math.ceil((r.bottom - r0.top) / S));
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) g[y * cols + x] = 1;
  };
  const tw = document.createTreeWalker(board, NodeFilter.SHOW_TEXT);
  while (tw.nextNode()) {
    const n = tw.currentNode;
    if (!n.textContent.trim()) continue;
    const range = document.createRange();
    range.selectNodeContents(n);
    for (const r of range.getClientRects()) mark(r);
  }
  board.querySelectorAll('img, svg, .tab, .ptab, .logo, .bar, .shot, .hole, .tl i, .ph, .dots, .slot').forEach((e) => mark(e.getBoundingClientRect()));
  let n = 0;
  for (const v of g) n += v;
  return Math.round(100 * (1 - n / g.length));
}
function fitAll() {
  document.querySelectorAll('[data-fit]').forEach((h) => {
    /* English: a fixed size by length, so long headlines are always smaller */
    if (!h.closest('[lang="bn"]')) {
      const n = h.textContent.length;
      const px = n <= 35 ? 112 : n <= 65 ? 92 : n <= 100 ? 74 : n <= 130 ? 64 : 60;
      h.style.fontSize = px + 'px'; h.dataset.chosen = px;
      h.dataset.lines = Math.round(h.offsetHeight / parseFloat(getComputedStyle(h).lineHeight));
      return;
    }
    const steps = h.dataset.fit.split(',').map(Number), max = +h.dataset.max;
    for (const px of steps) {
      h.style.fontSize = px + 'px';
      if (!h.closest('[lang="bn"]')) h.style.fontVariationSettings = `'opsz' ${Math.round(px * 0.36)}`;
      h.dataset.chosen = px;
      if (h.offsetHeight <= max) break;
    }
    const lh = parseFloat(getComputedStyle(h).lineHeight);
    h.dataset.lines = Math.round(h.offsetHeight / lh);
  });
}
document.fonts.ready.then(fitAll);
setTimeout(() => document.fonts.ready.then(fitAll), 2500);
if (q.get('fits')) document.fonts.ready.then(() => { fitAll(); document.getElementById('out').textContent = JSON.stringify([...document.querySelectorAll('[data-fit]')].map((h) => [h.closest('.board').id, +h.dataset.chosen, +h.dataset.lines])); });
if (q.get('m')) {
  document.fonts.ready.then(() => {
    const res = {};
    document.querySelectorAll('.board').forEach((b) => (res[b.id] = empty(b)));
    document.getElementById('out').textContent = JSON.stringify(res);
  });
}
</script>
