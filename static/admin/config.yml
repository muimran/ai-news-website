# Sveltia CMS — git-backed bilingual newsroom.
#
# Local editing (no login, writes straight into your working tree):
#   npm run dev  ->  http://localhost:5177/admin/  ->  "Work with Local Repository"
#
# Production: point backend.repo at your GitHub repo and deploy. Editors sign in
# with GitHub and every save becomes a commit.
#
# STRUCTURE NOTE: the two desks repeat their field definitions rather than
# sharing a YAML anchor. That is deliberate. `- *anchor` splices a list in as
# ONE nested element instead of flattening it, which silently corrupts the
# field list and breaks the admin. Explicit duplication is the right trade.
# If you add a field, add it to BOTH collections.

backend:
  name: github
  repo: muimran/ai-news-website
  branch: main
media_folder: static/uploads
public_folder: /uploads
publish_mode: editorial_workflow
collections:
- name: articles_en
  label: Articles — English
  label_singular: English article
  folder: content/articles/en
  create: true
  # filed by the year and month it's first saved: content/articles/<lang>/2026/09/<slug>.md
  # (that folder is also the story's address, so it never moves once published)
  path: '{{year}}/{{month}}/{{slug}}'
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{title}} — {{author}} ({{date}})'
  sortable_fields:
  - date
  - title
  - section
  - author
  view_filters:
  - label: Investigations
    field: kind
    pattern: Investigation
  fields:
  - name: title
    label: Headline
    widget: string
  - name: slug
    label: Web address (optional)
    widget: string
    required: false
    pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase English letters, numbers and hyphens only, e.g. grid-operator-says-no']
    hint: Leave empty and the address is made from the headline. Fill it in to make it shorter, e.g. grid-operator-says-no. It shows as /en/your-address and can't change once the story is published.
  - name: dek
    label: Dek (standfirst)
    widget: text
    hint: One or two sentences. This runs under the headline on the front page.
  - name: author
    label: Byline
    widget: string
  - name: tags
    label: Tags
    widget: list
    allow_add: true
    hint: Lowercase English. These generate topic pages and search filters.
  - name: kind
    label: Story type
    widget: select
    required: false
    hint: Optional. Set it only when the piece really is one of these; a story with no type shows no label.
    options:
    - Investigation
    - Interview
    - Explainer
    - Analysis
  - name: section
    label: Section
    widget: select
    options: &id001
    - The AI Race
    - AI & Everyday Life
    - Work After Automation
    - Machines and Power
    - AI Across Bangladesh
    - Climate, Chips & Infrastructure
    hint: Section keys stay in English in the file even on the Bangla desk — the site shows the Bangla
      label. Sharing keys is what lets a topic page span both editions.
  - name: image
    label: Lead photograph
    widget: image
    required: false
    hint: Leave empty and the story falls back to its generated artwork.
  - name: imageAlt
    label: Alt text
    widget: string
    required: false
    hint: What a screen-reader user hears instead of the photo. Describe what is shown, not that it is
      a photo. Fill this in whenever an image is set.
  - name: imageCredit
    label: Photo credit
    widget: string
    required: false
    hint: Photographer or agency. An uncredited photo is a rights problem.
  - name: cardColour
    label: Card colour
    widget: color
    required: false
    hint: The colour behind the headline on the story's card. Leave empty and it's taken from the top
      edge of the photo, which is usually right; set it when that colour looks wrong.
  - name: video
    label: Video URL
    widget: string
    required: false
    hint: Leave empty for a text story. Video is a format, not a section — file it to the beat it covers.
  - name: duration
    label: Video length (minutes)
    widget: number
    value_type: int
    required: false
    hint: Real runtime. Shown instead of the estimated read time.
  - name: authorTitle
    label: Author role
    widget: string
    required: false
  - name: location
    label: Dateline
    widget: string
    required: false
  - name: date
    label: Published
    widget: datetime
    format: YYYY-MM-DD
  - name: readTime
    label: Read time (minutes)
    widget: number
    value_type: int
    min: 1
  - name: weight
    label: Order within section
    widget: number
    value_type: int
    default: 5
    hint: 1 is the section lead. Lower numbers run higher.
  - name: featured
    label: Lead story
    widget: boolean
    default: false
    hint: Puts this story at the top of its topic (and of Interviews or Investigations), and first on the front page. Use it for the one story that matters most right now.
  - name: secondary
    label: Front-page secondary
    widget: boolean
    default: false
  - name: template
    label: Layout
    widget: select
    default: standard
    options:
    - label: Standard — prose column with sidebar
      value: standard
    - label: Wide — full width, for visual pieces
      value: wide
    - label: Immersive — dark ground, for data investigations
      value: immersive
    - label: Special — a hand-built page (src/specials/<web address>.svelte)
      value: special
    - label: Special — full screen, its own design with no site frame
      value: special-full
  - name: interviews
    label: Interviews
    widget: number
    value_type: int
    required: false
    hint: How many people the reporting drew on. Shown beside the story under "How we reported it"; leave empty to leave it out.
  - name: documents
    label: Documents
    widget: number
    value_type: int
    required: false
    hint: How many documents (contracts, records, filings) the reporting rests on.
  - name: reporting
    label: Reporting time
    widget: string
    required: false
    hint: In words, as it should read, e.g. "Six months of reporting".
  - name: sources
    label: Documents and data
    label_singular: Link
    widget: list
    required: false
    hint: Where readers can see the evidence for themselves (documents on DocumentCloud or Google Drive, a dataset on GitHub). Shown beside the story under "How we reported it".
    fields:
    - name: label
      label: Link text
      widget: string
      hint: What the reader gets, e.g. "Read the contracts" or "Get the data".
    - name: url
      label: Link
      widget: string
  - name: updates
    label: Updates and corrections
    label_singular: Change
    widget: list
    required: false
    hint: Every change made after publishing. Each is shown, dated, at the foot of the story, and the latest beside it. A correction says plainly what was wrong.
    fields:
    - name: date
      label: Date
      widget: datetime
      format: YYYY-MM-DD
    - name: kind
      label: Type
      widget: select
      default: Update
      options:
      - Update
      - Correction
    - name: note
      label: What changed
      widget: text
  - name: body
    label: Story
    widget: markdown
    hint: 'For a photo across the full width of the page, add a Wide photo block (or put a photo on a line of its own) with a caption and credit. For a source note in the margin, type [^1] straight after the sentence, and anywhere below it, on a line of its own, [^1]: and the source (use [^2] for the next, and so on). To point readers to another of our stories, paste its link on a line of its own: it shows as a card beside the text. For a pull quote, start the line with > and put who said it on the next line, starting with — (a dash).'
- name: articles_bn
  label: প্রতিবেদন — বাংলা
  label_singular: বাংলা প্রতিবেদন
  folder: content/articles/bn
  create: true
  # filed by the year and month it's first saved: content/articles/<lang>/2026/09/<slug>.md
  # (that folder is also the story's address, so it never moves once published)
  path: '{{year}}/{{month}}/{{slug}}'
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{title}} — {{author}} ({{date}})'
  sortable_fields:
  - date
  - title
  - section
  - author
  view_filters:
  - label: অনুসন্ধান
    field: kind
    pattern: Investigation
  fields:
  - name: title
    label: শিরোনাম
    widget: string
  - name: slug
    label: ওয়েব ঠিকানা, ইংরেজি অক্ষরে (ঐচ্ছিক)
    widget: string
    required: false
    pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন, যেমন dhaka-riders-address-map']
    hint: অনুবাদ হলে খালি রাখুন — ইংরেজি মূল প্রতিবেদনের ঠিকানাই ব্যবহার হবে। মৌলিক বাংলা প্রতিবেদনে ছোট একটি ইংরেজি ঠিকানা লিখুন, যেমন dhaka-riders-address-map; খালি রাখলে শিরোনাম ইংরেজি অক্ষরে লিখে ঠিকানা তৈরি হবে।
  - name: dek
    label: সূচনা
    widget: text
  - name: author
    label: প্রতিবেদক
    widget: string
  - name: tags
    label: বিষয়
    widget: list
    allow_add: true
    hint: বাংলায় লিখুন। এগুলো থেকেই বিষয়ভিত্তিক পাতা তৈরি হয়।
  - name: translationOf
    label: ইংরেজি মূল প্রতিবেদন
    widget: relation
    collection: articles_en
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    required: false
    hint: অনুবাদ হলে মূল ইংরেজি প্রতিবেদনটি বেছে নিন — তাহলে পাঠক দুই ভাষার মধ্যে সরাসরি যেতে পারবেন।
      মৌলিক প্রতিবেদন হলে খালি রাখুন।
  - name: kind
    label: ধরন
    widget: select
    required: false
    options:
    - Investigation
    - Interview
    - Explainer
    - Analysis
  - name: section
    label: বিভাগ
    widget: select
    options: *id001
    hint: Section keys stay in English in the file even on the Bangla desk — the site shows the Bangla
      label. Sharing keys is what lets a topic page span both editions.
  - name: image
    label: ছবি
    widget: image
    required: false
    hint: Leave empty and the story falls back to its generated artwork.
  - name: imageAlt
    label: ছবির বিকল্প লেখা
    widget: string
    required: false
    hint: What a screen-reader user hears instead of the photo. Describe what is shown, not that it is
      a photo. Fill this in whenever an image is set.
  - name: imageCredit
    label: ছবির কৃতিত্ব
    widget: string
    required: false
    hint: Photographer or agency. An uncredited photo is a rights problem.
  - name: cardColour
    label: Card colour
    widget: color
    required: false
    hint: The colour behind the headline on the story's card. Leave empty and it's taken from the top
      edge of the photo, which is usually right; set it when that colour looks wrong.
  - name: video
    label: ভিডিও লিংক
    widget: string
    required: false
    hint: Leave empty for a text story. Video is a format, not a section — file it to the beat it covers.
  - name: duration
    label: ভিডিওর দৈর্ঘ্য (মিনিট)
    widget: number
    value_type: int
    required: false
    hint: Real runtime. Shown instead of the estimated read time.
  - name: authorTitle
    label: পদবি
    widget: string
    required: false
  - name: location
    label: স্থান
    widget: string
    required: false
  - name: date
    label: প্রকাশের তারিখ
    widget: datetime
    format: YYYY-MM-DD
  - name: readTime
    label: পাঠের সময় (মিনিট)
    widget: number
    value_type: int
    min: 1
  - name: weight
    label: বিভাগে ক্রম
    widget: number
    value_type: int
    default: 5
    hint: 1 is the section lead. Lower numbers run higher.
  - name: featured
    label: প্রধান প্রতিবেদন
    widget: boolean
    default: false
    hint: প্রতিবেদনটি তার বিষয়ের (এবং সাক্ষাৎকার বা অনুসন্ধানের) শীর্ষে আর প্রথম পাতায় সবার আগে দেখায়। এই মুহূর্তে সবচেয়ে গুরুত্বপূর্ণ একটি প্রতিবেদনের জন্যই ব্যবহার করুন।
  - name: secondary
    label: প্রচ্ছদের দ্বিতীয়
    widget: boolean
    default: false
  - name: template
    label: বিন্যাস
    widget: select
    default: standard
    options:
    - label: Standard — prose column with sidebar
      value: standard
    - label: Wide — full width, for visual pieces
      value: wide
    - label: Immersive — dark ground, for data investigations
      value: immersive
    - label: Special — a hand-built page (src/specials/<web address>.svelte)
      value: special
    - label: Special — full screen, its own design with no site frame
      value: special-full
  - name: interviews
    label: সাক্ষাৎকার
    widget: number
    value_type: int
    required: false
    hint: প্রতিবেদনে কতজনের সঙ্গে কথা বলা হয়েছে। প্রতিবেদনের পাশে "যেভাবে প্রতিবেদনটি তৈরি" অংশে দেখায়; না দিলে দেখাবে না।
  - name: documents
    label: নথি
    widget: number
    value_type: int
    required: false
    hint: প্রতিবেদনটি কতগুলো নথির (চুক্তি, রেকর্ড, দাখিলপত্র) ওপর দাঁড়িয়ে।
  - name: reporting
    label: অনুসন্ধানের সময়
    widget: string
    required: false
    hint: যেভাবে পড়া উচিত, সেভাবে লিখুন, যেমন "ছয় মাসের অনুসন্ধান"।
  - name: sources
    label: নথি ও ডেটা
    label_singular: লিংক
    widget: list
    required: false
    hint: পাঠক নিজে যেখানে প্রমাণ দেখতে পারবেন (ডকুমেন্টক্লাউড বা গুগল ড্রাইভে নথি, গিটহাবে ডেটা)। প্রতিবেদনের পাশে "যেভাবে প্রতিবেদনটি তৈরি" অংশে দেখায়।
    fields:
    - name: label
      label: লিংকের লেখা
      widget: string
      hint: পাঠক কী পাবেন, যেমন "চুক্তিগুলো পড়ুন" বা "ডেটা নিন"।
    - name: url
      label: লিংক
      widget: string
  - name: updates
    label: হালনাগাদ ও সংশোধন
    label_singular: পরিবর্তন
    widget: list
    required: false
    hint: প্রকাশের পর প্রতিটি পরিবর্তন। প্রতিবেদনের শেষে তারিখসহ দেখায়, আর সর্বশেষটি পাশে। সংশোধনে স্পষ্ট লিখুন কী ভুল ছিল।
    fields:
    - name: date
      label: তারিখ
      widget: datetime
      format: YYYY-MM-DD
    - name: kind
      label: ধরন
      widget: select
      default: Update
      options:
      - label: হালনাগাদ
        value: Update
      - label: সংশোধন
        value: Correction
    - name: note
      label: কী বদলেছে
      widget: text
  - name: body
    label: প্রতিবেদন
    widget: markdown
    hint: 'For a photo across the full width of the page, add a Wide photo block (or put a photo on a line of its own) with a caption and credit. মার্জিনে সূত্র দিতে বাক্যের ঠিক পরে লিখুন [^1], আর নিচে যেকোনো জায়গায় আলাদা লাইনে [^1]: এবং সূত্রটি (পরেরটির জন্য [^2], এভাবে)। আমাদের আরেকটি প্রতিবেদনের দিকে পাঠককে নিতে তার লিংক আলাদা লাইনে দিন: লেখার পাশে কার্ড হয়ে দেখাবে। উদ্ধৃতির জন্য লাইন শুরু করুন > দিয়ে, আর কে বলেছেন তা পরের লাইনে — (ড্যাশ) দিয়ে।'
# The glossary: a term and its meaning, written once. The site explains the
# first time each term appears in every story of that language, by itself;
# nothing is marked inside the stories. (Two desks, as above, not an anchor.)
- name: glossary_en
  label: Glossary — English
  label_singular: Term
  folder: content/glossary/en
  create: true
  slug: '{{slug}}'
  identifier_field: term
  summary: '{{term}}'
  sortable_fields:
  - term
  fields:
  - name: term
    label: Term
    widget: string
    hint: As it's usually written in a story, e.g. "open-weight model".
  - name: also
    label: Also written as
    widget: list
    required: false
    hint: Other ways stories write it, to explain those too, e.g. "open weights". Plurals (data centres) are found without listing them.
  - name: meaning
    label: Meaning
    widget: text
    hint: Two short sentences at most, for a reader meeting the term for the first time. Plain words; no jargon to explain the jargon.
- name: glossary_bn
  label: শব্দকোষ — বাংলা
  label_singular: শব্দ
  folder: content/glossary/bn
  create: true
  slug: '{{slug}}'
  identifier_field: term
  summary: '{{term}}'
  sortable_fields:
  - term
  fields:
  - name: term
    label: শব্দ
    widget: string
    hint: প্রতিবেদনে সাধারণত যেভাবে লেখা হয়, যেমন "ডেটা সেন্টার"।
  - name: also
    label: অন্যভাবে লেখা
    widget: list
    required: false
    hint: প্রতিবেদনে শব্দটি আর যেভাবে লেখা হয়, সেগুলোও ব্যাখ্যা পাবে।
  - name: meaning
    label: অর্থ
    widget: text
    hint: বড়জোর দুটি ছোট বাক্য, প্রথমবার শব্দটি দেখছেন এমন পাঠকের জন্য। সহজ ভাষায়।
