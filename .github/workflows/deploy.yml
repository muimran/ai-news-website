name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # picture colours and sizes worked out by earlier builds (by contents)
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            static/uploads/sized
          key: pictures-${{ hashFiles('static/uploads/**', '!static/uploads/sized/**') }}
          restore-keys: pictures-
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - run: touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
